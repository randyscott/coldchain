# =============================================================================
# Docker Compose — Alternative to k3s for simpler local development.
# Same containers, same configuration, just docker-compose networking.
#
# Usage:
#   docker compose up -d
#   docker compose exec timescaledb psql -U coldchain -d coldchain -f /docker-entrypoint-initdb.d/init-db.sql
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB (PostgreSQL with time-series extensions)
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: coldchain-timescaledb
    environment:
      POSTGRES_USER: coldchain
      POSTGRES_PASSWORD: coldchain_dev_password
      POSTGRES_DB: coldchain
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/20-app-schema.sql:ro
      - ./scripts/docker-init-chirpstack-db.sh:/docker-entrypoint-initdb.d/10-chirpstack-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldchain"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Eclipse Mosquitto (MQTT Broker)
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: coldchain-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto/password_file:/mosquitto/config/password_file:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 -u coldchain -P coldchain_dev || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (ChirpStack deduplication cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: coldchain-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Keycloak (Identity & Access Management)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: coldchain-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"   # Keycloak admin + OIDC endpoints
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://timescaledb:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_password
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/auth"
    volumes:
      - ./config/keycloak/coldchain-realm.json:/opt/keycloak/data/import/coldchain-realm.json:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ChirpStack v4 (LoRaWAN Network Server)
  # ---------------------------------------------------------------------------
  chirpstack:
    image: chirpstack/chirpstack:4
    container_name: coldchain-chirpstack
    command: -c /etc/chirpstack
    ports:
      - "8080:8080"   # Web UI + API
    volumes:
      - ./config/chirpstack:/etc/chirpstack:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ChirpStack Gateway Bridge (UDP -> MQTT translator)
  # ---------------------------------------------------------------------------
  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    container_name: coldchain-gateway-bridge
    ports:
      - "1700:1700/udp"  # Semtech Packet Forwarder UDP
    environment:
      INTEGRATION__MQTT__AUTH__GENERIC__SERVER: "tcp://mosquitto:1883"
      INTEGRATION__MQTT__AUTH__GENERIC__USERNAME: "chirpstack"
      INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD: "chirpstack_mqtt_dev"
      BACKEND__TYPE: "semtech_udp"
      BACKEND__SEMTECH_UDP__UDP_BIND: "0.0.0.0:1700"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Integration Service (FastAPI — MQTT consumer + REST API + Alert Engine)
  # ---------------------------------------------------------------------------
  integration:
    build:
      context: ./services/integration
    container_name: coldchain-integration
    ports:
      - "8000:8000"   # REST API
    environment:
      COLDCHAIN_DATABASE_URL: "postgresql+asyncpg://coldchain:coldchain_dev_password@timescaledb:5432/coldchain"
      COLDCHAIN_MQTT_HOST: "mosquitto"
      COLDCHAIN_MQTT_PORT: "1883"
      COLDCHAIN_MQTT_USERNAME: "coldchain"
      COLDCHAIN_MQTT_PASSWORD: "coldchain_dev"
      COLDCHAIN_AUTH_ENABLED: "false"
      COLDCHAIN_ENVIRONMENT: "development"
      COLDCHAIN_LOG_LEVEL: "INFO"
      COLDCHAIN_SMTP_HOST: "mailhog"
      COLDCHAIN_SMTP_PORT: "1025"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Sensor Simulator (development only)
  # ---------------------------------------------------------------------------
  simulator:
    build:
      context: ./services/simulator
    container_name: coldchain-simulator
    command:
      - "--mqtt-host"
      - "mosquitto"
      - "--mqtt-port"
      - "1883"
      - "--mqtt-user"
      - "coldchain"
      - "--mqtt-pass"
      - "coldchain_dev"
      - "--interval"
      - "30"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MailHog (Local email capture for testing alerts)
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: coldchain-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

volumes:
  timescaledb_data:
    driver: local
  mosquitto_data:
    driver: local
