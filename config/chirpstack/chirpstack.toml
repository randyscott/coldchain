# =============================================================================
# ChirpStack v4 Configuration
# =============================================================================

[logging]
  level="info"

[postgresql]
  dsn="postgres://chirpstack:chirpstack_dev_password@timescaledb:5432/chirpstack?sslmode=disable"
  max_open_connections=10
  min_idle_connections=5

[redis]
  servers=["redis://redis:6379"]

[network]
  net_id="000000"
  enabled_regions=["us915_0"]  # Adjust for your region

[monitoring]
  bind="0.0.0.0:8070"

[api]
  bind="0.0.0.0:8080"
  secret="coldchain-dev-api-secret-change-in-production"

[gateway]
  # Allow unknown gateways to connect (useful for dev)
  allow_unknown_gateways=true

[integration]
  enabled=["mqtt"]

  [integration.mqtt]
    server="tcp://coldchain:coldchain_dev@mosquitto:1883"
    json=true
    # Event topic template
    # ChirpStack publishes decoded uplinks to:
    #   application/{application_id}/device/{dev_eui}/event/up
    event_topic="application/{{application_id}}/device/{{dev_eui}}/event/{{event}}"
    command_topic="application/{{application_id}}/device/{{dev_eui}}/command/{{command}}"
