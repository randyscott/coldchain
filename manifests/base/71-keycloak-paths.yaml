# Middleware: prepend /auth to paths that Keycloak generates without the prefix
# (theme resources at /resources/... and login actions at /realms/...)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-add-prefix
  namespace: coldchain
spec:
  addPrefix:
    prefix: /auth

---
# Separate Ingress so the middleware only applies to these paths, not to /
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coldchain-keycloak-paths
  namespace: coldchain
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: coldchain-keycloak-add-prefix@kubernetescrd
spec:
  tls:
    - hosts:
        - coldchain.salticidae.net
      secretName: coldchain-tls
  rules:
    - host: coldchain.salticidae.net
      http:
        paths:
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8081
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8081
