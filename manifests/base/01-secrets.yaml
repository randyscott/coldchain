# =============================================================================
# Secrets — In production, use sealed-secrets or external secret management.
# For local dev, plain secrets are acceptable.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: timescaledb-credentials
  namespace: coldchain
type: Opaque
stringData:
  POSTGRES_USER: "coldchain"
  POSTGRES_PASSWORD: "coldchain_dev_password"
  POSTGRES_DB: "coldchain"
  # Connection string for other services
  DATABASE_URL: "postgresql+asyncpg://coldchain:coldchain_dev_password@timescaledb:5432/coldchain"

---
apiVersion: v1
kind: Secret
metadata:
  name: chirpstack-db-credentials
  namespace: coldchain
type: Opaque
stringData:
  POSTGRES_USER: "chirpstack"
  POSTGRES_PASSWORD: "chirpstack_dev_password"
  POSTGRES_DB: "chirpstack"

---
apiVersion: v1
kind: Secret
metadata:
  name: chirpstack-api-credentials
  namespace: coldchain
type: Opaque
stringData:
  COLDCHAIN_CHIRPSTACK_API_TOKEN: ""   # Fill in after creating an API key in ChirpStack UI

---
apiVersion: v1
kind: Secret
metadata:
  name: mosquitto-credentials
  namespace: coldchain
type: Opaque
stringData:
  MQTT_USER: "coldchain"
  MQTT_PASSWORD: "coldchain_dev"
  MQTT_URL: "mqtt://coldchain:coldchain_dev@mosquitto:1883"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: coldchain
type: Opaque
stringData:
  REDIS_URL: "redis://redis:6379"
